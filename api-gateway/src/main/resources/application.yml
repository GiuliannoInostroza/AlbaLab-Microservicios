server:
  port: 9090

spring:
  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: esta_es_mi_compleja_clave_secreta

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:9094
          predicates:
            - Path=/auth/**
        - id: contenidos-service
          uri: http://contenidos-service:9091
          predicates:
            - Path=/programas/**
        - id: vinculacion-service
          uri: http://vinculacion-service:9092
          predicates:
            - Path=/solicitudes/**
